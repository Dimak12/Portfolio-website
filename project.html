<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Project | Plandi Makali</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

<nav class="site-nav">
  <div class="nav-inner">
    <a href="index.html#home" class="wordmark">Plandi Makali</a>
    <button class="menu-toggle" aria-label="Open menu" aria-expanded="false"><i class="fas fa-bars"></i></button>
    <ul class="nav-links">
      <li><a href="index.html#about">About</a></li>
      <li><a href="index.html#projects">Projects</a></li>
      <li><a href="index.html#experience">Experience</a></li>
      <li><a href="index.html#education">Education</a></li>
      <li><a href="index.html#skills">Skills</a></li>
      <li><a href="index.html#contact" class="nav-cta">Contact</a></li>
    </ul>
  </div>
</nav>

<main class="project-page">
  <div class="container">
    <a href="index.html#projects" class="back-link"><i class="fas fa-arrow-left"></i> All projects</a>

    <header class="project-hero">
      <p class="eyebrow" id="project-category"></p>
      <h1 id="project-title"></h1>
      <p class="project-subtitle" id="project-subtitle"></p>
      <dl class="project-facts" id="project-facts"></dl>
      <div class="project-actions" id="project-actions"></div>
    </header>

    <div class="project-layout">
      <article class="prose project-body" id="project-description"></article>
      <aside class="project-aside">
        <h2 class="aside-title">Technologies</h2>
        <div class="tag-list" id="project-technologies"></div>
      </aside>
    </div>

    <section class="media-section" id="video-section" hidden>
      <h2 class="media-title">Demo</h2>
      <div id="project-videos" class="video-list"></div>
    </section>

    <section class="media-section" id="gallery-section" hidden>
      <h2 class="media-title">Figures</h2>
      <div id="project-gallery" class="gallery"></div>
    </section>

    <nav class="project-pager" id="project-pager"></nav>
  </div>
</main>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" hidden>
  <button class="lb-close" aria-label="Close"><i class="fas fa-xmark"></i></button>
  <button class="lb-prev" aria-label="Previous image"><i class="fas fa-chevron-left"></i></button>
  <figure class="lb-figure">
    <img id="lb-image" alt="" />
    <figcaption id="lb-caption"></figcaption>
  </figure>
  <button class="lb-next" aria-label="Next image"><i class="fas fa-chevron-right"></i></button>
</div>

<footer class="site-footer">
  <div class="container footer-inner">
    <p>&copy; <span class="year"></span> Plandi Makali</p>
    <p>Cape Town, South Africa</p>
  </div>
</footer>

<script src="script.js"></script>
</body>
</html>
